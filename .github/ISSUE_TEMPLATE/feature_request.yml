name: Feature request / 功能建议
description: Suggest an improvement / 建议新功能或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 感谢建议。请说明真实使用场景，而不只是实现方式。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前工作流中遇到了什么限制？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述期望的行为和用户界面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - 启动项发现与管理
        - 接管条件与编排
        - 配置、备份与日志
        - 界面、托盘与可访问性
        - 构建、发布与文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全与兼容性
      options:
        - label: 我已说明该功能对 Windows 权限和恢复行为的预期影响（如适用）。
          required: true
